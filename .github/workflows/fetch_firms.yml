name: Fetch Fire Hotspots (FIRMS)

on:
  schedule:
    # Near-real-time refresh: every 5 minutes. GitHub doesn't guarantee
    # exact timing on schedules this frequent — during high platform load
    # a run can slip by a few minutes, but it always catches up on the
    # next tick. Safe to run this often since the repo is public (no
    # Actions-minutes budget to worry about).
    - cron: '*/5 * * * *'
  workflow_dispatch:

# At a 5-minute cadence a slow run (pip install, slow FIRMS response) can
# still be going when the next scheduled run starts. Without this guard,
# two runs could both `git push` around the same time and fight over the
# same branch. `cancel-in-progress: false` means a newer run *waits* for
# the older one to finish instead of racing or being killed mid-write.
concurrency:
  group: fetch-firms
  cancel-in-progress: false

jobs:
  fetch-firms:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch NASA FIRMS hotspots
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/fetch_firms.py

      - name: Commit updated hotspots data
        run: |
          git config user.name "FireWatch Bot"
          git config user.email "bot@firewatch-sar.github.io"
          git pull --rebase origin main
          git add data/hotspots.geojson data/manifest.json
          git diff --staged --quiet || git commit -m "chore: update hotspots $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push