name: Fetch Infrastructure

on:
  schedule:
    # ── TEMPORARY: initial full-world crawl ──────────────────────────
    # Running every 20 minutes with no date restriction to complete the
    # FIRST full pass over all ~500 tiles quickly (~5-7 days). Once
    # infra_progress.json shows laps_completed >= 1 (next_index back at
    # 0), switch this back to the once-a-year January-only schedule:
    #   - cron: '*/20 * 1-10 1 *'
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-infrastructure
  cancel-in-progress: false

jobs:
  fetch-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch next world tile
        run: python scripts/fetch_infrastructure.py
        env:
          FORCE_CRAWL: "true"

      - name: Commit updated infrastructure data
        run: |
          git config user.name "FireWatch Bot"
          git config user.email "bot@firewatch-sar.github.io"
          git add data/infrastructure.geojson data/infra_progress.json data/manifest.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: infrastructure world crawl tile $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push