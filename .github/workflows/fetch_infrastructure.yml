name: Fetch Infrastructure

# DISABLED as of the migration to remote_server/ — infrastructure is now
# crawled continuously on Doris's own machine (see remote_server/README.md)
# instead of one tile per GitHub Actions run.
#
# Kept here (schedule commented out) rather than deleted, in case this
# ever needs to run again as a one-off manual backfill —
# workflow_dispatch still works for that.
on:
  # - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-infrastructure
  cancel-in-progress: false

jobs:
  fetch-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch next world tile
        run: python scripts/fetch_infrastructure.py
        env:
          FORCE_CRAWL: "true"

      - name: Commit updated infrastructure data
        run: |
          git config user.name "FireWatch Bot"
          git config user.email "bot@firewatch-sar.github.io"
          git add data/infrastructure.geojson data/infra_progress.json data/manifest.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: infrastructure world crawl tile $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push